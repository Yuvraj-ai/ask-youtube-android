security_checks:
  - { check: "No API key in source, resources, or BuildConfig", method: "detect_secrets.py on this repo", status: pass, evidence: "0 findings, re-run after the port" }
  - { check: "Key stored encrypted at rest", method: "EncryptedSharedPreferences; keysets present in the on-device prefs file", status: pass }
  - { check: "Key never logged or surfaced in errors", method: "code review of GeminiClient and AppError; key only ever an x-goog-api-key header", status: pass }
  - { check: "HTTPS only, cleartext disabled", method: "network_security_config base-config cleartextTrafficPermitted=false", status: pass }
  - { check: "INTERNET is the only permission", method: "manifest review", status: pass }
  - { check: "Backups excluded so the key is not exported", method: "android:allowBackup=false", status: pass }

verified_this_session:
  - id: V1
    check: Source repo contains no hardcoded secrets
    method: python-to-android-migrator detect_secrets.py
    result: "0 findings"
    status: pass
  - id: V2
    check: Gemini embedding model and dims
    method: vendor documentation
    result: "gemini-embedding-2, 8192 input tokens, 128-3072 output dims, 768 recommended; embedding-001 legacy"
    status: pass
  - id: V3
    check: Gemini generation model currency
    method: vendor documentation
    result: "gemini-3.5-flash GA and stable; source's gemini-2.0-flash is legacy"
    status: pass
  - id: V4
    check: REST contract shape for embedContent and generateContent
    method: vendor documentation
    result: "x-goog-api-key header, content.parts[].text, embedding.values, candidates[0].content.parts[0].text"
    status: pass
  - id: V5
    check: YouTube watch page yields captionTracks
    method: curl against youtube.com
    result: "PASS — 2 tracks (en, de) extracted from jNQXAC9IVRw"
    status: pass
  - id: V6
    check: YouTube watch page requires a desktop User-Agent
    method: curl with and without UA
    result: "UA required"
    status: pass
  - id: V7
    check: YouTube caption payload (timedtext) fetch
    method: curl with fmt=json3, srv3, vtt, with and without cookies and referer
    result: >
      FAIL — every variant returned HTTP 200 with content-length 0 and
      content-type text/html from server video-timedtext. Egress IP 110.235.218.230
      is a datacenter address and YouTube serves empty captions to those. The
      parser is unit-tested against fixtures instead, and a zero-length body maps
      to a distinct user-facing error.
    status: blocked
  - id: V8
    check: JDK and Gradle available for the build
    method: "no system JDK and sudo needs a password; installed a portable Temurin 17 to /tmp and Gradle 8.9, then generated the wrapper"
    status: pass
  - id: V9
    check: Debug APK builds
    method: ./gradlew assembleDebug
    result: "BUILD SUCCESSFUL, 11.0 MB, zero warnings"
    status: pass
  - id: V10
    check: Unit tests
    method: ./gradlew testDebugUnitTest
    result: "55 tests, 0 failures (VideoId 10, Chunker 11, VectorIndex 17, TranscriptParser 17)"
    status: pass
  - id: V11
    check: App installs, launches, and renders both screens on a device
    method: emulator API 36, installDebug, screencap
    result: "PASS — Home and Settings render, no crash, app process alive"
    status: pass
  - id: V12
    check: Dark mode and appearance override
    method: adb shell cmd uimode night yes; select Light; cold start
    result: "PASS — both themes correct, override persists across a process kill"
    status: pass
  - id: V13
    check: Stitch design tooling
    method: Stitch MCP over JSON-RPC
    result: >
      Design system and 3 screens generated from .stitch/DESIGN.md. edit_screens
      reports success but does NOT persist to the exported HTML or PNG, verified
      via both list_screens and get_screen returning byte-identical artefacts.
      The two unwanted details it failed to remove (a YouTube logo, a placeholder
      URL) were simply not reproduced in the Compose code.
    status: "pass with a known tool limitation"

added_beyond_source_later:
  - id: provider_selection
    what: "Gemini or any OpenAI-compatible server, chosen in Settings."
    where: data/llm/LlmClient.kt, LlmClientFactory.kt, OpenAiCompatibleClient.kt
    status: pass
    evidence: >
      Provider chips and the conditional base-URL field render on the emulator
      (screenshots 17, 18). 9 unit tests cover the response shapes, the base-URL
      normalisation and the shared error mapping. Not verified against a live
      third-party host, because none was available.

  - id: independent_embedding_config
    what: "Embeddings can use a different address, key and model from chat."
    where: data/settings/SettingsStore.kt, LlmClientFactory.embedClient
    status: pass
    evidence: >
      "Same as chat" / "Separate" chips plus separate address, key and model
      fields, confirmed on device (screenshot 18). A missing embedding key maps
      to its own error rather than a generic failure.

  - id: base_url_hardening
    what: "Pasted server addresses are normalised."
    status: pass
    evidence: >
      A test caught that trimEnd('/') alone left surrounding whitespace, which
      would have produced a malformed request from a copied URL. The client now
      trims whitespace and trailing slashes; covered by three assertions.

