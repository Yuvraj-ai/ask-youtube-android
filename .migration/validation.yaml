  - { check: "No key in the repository", method: "detect_secrets.py plus a literal scan for the supplied key", result: "0 findings; supplied key absent from every file; repo has no commits" }
  - { check: "Stitch design artifacts do not carry key-shaped strings", method: "detect_secrets.py flagged a Stitch-generated placeholder key (redacted) in a generated design HTML; scrubbed", result: "re-scan clean" }

build_status:
  compile: pass
  tests: pass
  device_run: pass
  honest_statement: >
    The app compiles, 55 unit tests pass, and it installs and renders on an
    emulator in both light and dark themes, with the error path exercised. What
    is NOT verified: the full end-to-end answer, because it needs a live Gemini
    API key, and a live transcript fetch, because YouTube serves empty captions
    to this datacenter IP (V7). No claim of end-to-end parity is made.
