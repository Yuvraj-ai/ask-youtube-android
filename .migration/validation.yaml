    what: "Full dark theme, following the OS by default."
    where: ui/theme/Theme.kt, MainActivity.ThemedApp
    status: pass
    evidence: "Emulator forced to night mode; Home and Settings both re-rendered correctly (screenshots 07, 08)."

  - id: appearance_override
    what: "System / Light / Dark chips in Settings, persisted."
    where: ui/settings/SettingsScreen.kt Appearance section
    status: pass
    evidence: >
      With the OS in dark mode, selecting Light re-themed the app immediately and
      the choice survived a cold start (screenshot 12). Confirmed in the
      encrypted prefs file, which holds the theme value alongside the two
      androidx keysets.

