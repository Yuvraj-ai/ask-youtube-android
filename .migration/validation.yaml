# Traceability matrix and validation status.

# Status values: pass verified here, blocked cannot be verified in this
# environment, pending not yet checked, manual requires a device or a live key.

traceability:
  - source_feature: gemini_api_key_entry
    action: modify
    android_code: ui/settings/SettingsScreen.kt, data/settings/SettingsStore.kt
    test: Screenshotted on emulator; empty state, show/hide, status pill, clear
    status: pass

  - source_feature: youtube_url_entry
    action: preserve
    android_code: domain/VideoId.kt, ui/home/HomeScreen.kt
    test: VideoIdTest — bare id, watch URL, youtu.be, shorts, embed, bad input
    status: pass

  - source_feature: question_entry
    action: modify
    android_code: ui/home/HomeScreen.kt chat input
    test: typed and sent on emulator
    status: pass

  - source_feature: submit_action
    action: replace
    android_code: ui/home/HomeViewModel.kt
    test: send gated on non-empty url+question; disabled state rendered
    status: pass

  - source_feature: transcript_extraction
    action: modify
    android_code: data/transcript/YouTubeTranscriptFetcher.kt
    test: TranscriptParserTest — 17 cases incl. ASR fallback and bracket matching
    status: pass
    caveat: "live fetch unverified, see V7"

  - source_feature: transcript_chunking
    action: preserve
    android_code: domain/Chunker.kt
    test: ChunkerTest — 11 cases, sizes, overlap, timings, clamp, no content loss
    status: pass

  - source_feature: transcript_embedding
    action: replace
    android_code: data/gemini/GeminiClient.embedText
    test: requires a live Gemini key
    status: manual

  - source_feature: vector_index_and_search
    action: replace
    android_code: domain/VectorIndex.kt
    test: VectorIndexTest — 17 cases, cosine, top-k ordering, dim mismatch
    status: pass

  - source_feature: answer_generation
    action: preserve
    android_code: data/gemini/GeminiClient.generate, domain/RagEngine.kt
    test: requires a live Gemini key
    status: manual

  - source_feature: answer_display
    action: replace
    android_code: ui/home/HomeScreen.kt
    test: paragraph breaks preserved; verified in the Stitch design, not on device
    status: pending

  - source_feature: retrieved_sources
    action: modify
    android_code: ui/home/SourcesSection within TurnCard
    test: mono timestamps + disclosure; verified in design, not on device
    status: pending

  - source_feature: conversation_history
    action: add
    android_code: ui/home/HomeViewModel.kt
    test: session-only turns, in-memory
    status: pass

  - source_feature: index_caching
    action: add
    android_code: domain/RagEngine.kt
    test: single-video cache; second question reuses it
    status: pass

  - source_feature: error_handling
    action: add
    android_code: domain/AppError.kt, ui/home/ErrorCard
    test: NoApiKey path exercised on device; typed messages, no crash
    status: pass

  - source_feature: app_branding
    action: modify
    android_code: strings.xml, manifest label, adaptive launcher icon
    test: label reads AskYoutube; icon is a brand-neutral speech bubble
    status: pass

  - source_feature: sidebar_form_layout
    action: remove
    android_code: n/a — contents redistributed to home and settings
    test: no sidebar equivalent remains
    status: pass

added_beyond_source:
