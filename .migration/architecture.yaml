# Target architecture — AskYoutube (on-device BYOK, no backend)

# Current (source) architecture

# See analysis.md. Summary: Streamlit presentation fused with LangChain
# orchestration, rebuilt per rerun, no persistence, no API boundary, no config layer.

# Proposed target architecture

