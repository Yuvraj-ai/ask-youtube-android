<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-canvas text-ink antialiased min-h-screen flex flex-col justify-between selection:bg-surface-muted selection:text-ink">
<!-- Mobile Screen Container (Constrained 640px Max Width) -->
<div class="w-full max-w-[640px] mx-auto min-h-screen flex flex-col bg-surface border-x border-hairline relative">
<!-- 1. Native Android Status Bar -->
<header class="w-full bg-surface select-none">
<div class="h-6 px-margin flex items-center justify-between text-xs text-ink-muted">
<span class="font-mono-data text-mono-data font-medium tracking-tight text-ink">9:41</span>
<div class="flex items-center space-x-1.5">
<span class="material-symbols-outlined text-[15px] leading-none" data-icon="signal_cellular_4_bar">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[15px] leading-none" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[16px] leading-none" data-icon="battery_full">battery_full</span>
</div>
</div>
<!-- Shared Component: TopAppBar -->
<div class="w-full max-w-[640px] mx-auto flex items-center justify-between px-margin h-14 border-b border-hairline bg-surface">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[24px]" data-icon="smart_display" data-weight="fill" style="font-variation-settings: 'FILL' 1;">smart_display</span>
<h1 class="font-headline-md text-headline-md font-bold text-ink tracking-tight">AskYoutube</h1>
</div>
<button aria-label="Settings" class="w-10 h-10 -mr-2 flex items-center justify-center rounded-full text-ink hover:bg-surface-muted transition-colors duration-150 ease-out active:opacity-80" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="settings">settings</span>
</button>
</div>
</header>
<!-- 2. Video Field Region -->
<section class="w-full pt-3 pb-4 px-margin border-b border-hairline bg-surface">
<label class="block font-label text-label text-ink-muted mb-1.5" for="youtube-link-input">
        YouTube link
      </label>
<div class="relative">
<input class="w-full h-11 px-3.5 bg-surface text-ink text-body-md font-body-md placeholder:text-ink-faint border border-hairline rounded-xl focus:outline-none focus:border-ember focus:ring-1 focus:ring-ember transition-colors duration-150" id="youtube-link-input" placeholder="https://www.youtube.com/watch?v=..." type="url"/>
</div>
</section>
<!-- 3. Empty State (Main Content - Optical Center) -->
<main class="flex-1 flex flex-col items-center justify-center px-margin py-8">
<div class="w-full max-w-[380px] flex flex-col items-center text-center">
<!-- Headline -->
<h2 class="font-headline-lg text-headline-lg font-semibold text-ink">
          Ask any YouTube video
        </h2>
<!-- Body Copy -->
<p class="mt-2 text-ink-muted font-body-md text-body-md max-w-[340px] leading-relaxed">
          Paste a link above, then ask a question. Answers come only from that video's transcript.
        </p>
<!-- Inline Warning Pill -->
<div class="mt-5 w-full bg-error-container/40 border border-error/20 rounded-lg py-2 px-3 flex items-center justify-center gap-1.5">
<span class="material-symbols-outlined text-error text-[18px] flex-shrink-0" data-icon="warning">warning</span>
<span class="font-body-sm text-body-sm text-error font-medium text-left">
            Add your Gemini API key in Settings to get started.
          </span>
</div>
<!-- Single Action Button -->
<div class="mt-4">
<button class="h-9 px-4 inline-flex items-center justify-center gap-1.5 rounded-lg border border-hairline bg-surface hover:bg-surface-muted text-ink font-label text-label transition-colors duration-150 ease-out active:opacity-80" type="button">
<span class="material-symbols-outlined text-[16px] text-ink-muted" data-icon="settings">settings</span>
<span>Settings</span>
</button>
</div>
</div>
</main>
<!-- 4. Pinned Bottom Input Bar & Navigation Pill -->
<footer class="w-full bg-surface border-t border-hairline select-none">
<div class="px-margin py-3 flex items-center gap-3">
<!-- Inactive Empty Text Field -->
<div class="flex-1 relative">
<input class="w-full h-12 px-4 bg-surface-muted border border-hairline rounded-full text-body-md font-body-md text-ink placeholder:text-ink-faint cursor-not-allowed select-none focus:outline-none" disabled="" placeholder="Ask about this video" type="text"/>
</div>
<!-- 48dp Send Button (Inactive Ember State) -->
<button aria-label="Send question" class="w-12 h-12 rounded-full bg-ember opacity-50 flex items-center justify-center cursor-not-allowed flex-shrink-0 text-on-primary" disabled="" type="button">
<span class="material-symbols-outlined text-[20px] text-white" data-icon="arrow_upward">arrow_upward</span>
</button>
</div>
<!-- Android Navigation Bar Pill -->
<div class="h-5 w-full flex items-center justify-center pb-1">
<div class="w-28 h-1 bg-ink/30 rounded-full"></div>
</div>
</footer>
</div>
</body></html>
